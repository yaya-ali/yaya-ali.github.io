<style>
:root{
  --bg:#0d1220; --bg2:#121a2e; --panel:#172138; --line:#26324f;
  --text:#eef1f8; --muted:#8e99b5; --dim:#5d6886;
  --phish:#ff5a5f; --phish-ink:#3a0c0e; --legit:#2bd9a0; --legit-ink:#062b20;
  --gold:#ffc857; --paper:#f7f8fb; --ink:#1b2133; --ink2:#5b6378;

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;

.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

.row{display:flex;gap:10px;align-items:center} .grow{flex:1} .stack>*+*{margin-top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}

.hero h1{font-size:clamp(44px,13vw,68px);line-height:.92;font-weight:800}

.hero p{color:var(--muted);margin-top:12px;font-size:17px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font:inherit;outline:none;transition:border-color .15s}

textarea{resize:vertical;min-height:90px}

.hl{outline:3px solid var(--phish);outline-offset:3px;border-radius:6px}

.board .sc{font:700 16px "JetBrains Mono";min-width:56px;text-align:right}

.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:8px 0 4px}
.podium>div{text-align:center;border-radius:14px 14px 4px 4px;padding:12px 6px;background:var(--bg2);border:1px solid var(--line)}
.podium .n{font-weight:700;font-size:15px;word-break:break-word} .podium .s{font:700 13px "JetBrains Mono";color:var(--muted)}
.podium .m{font-size:26px}
.podium .p1{min-height:150px;border-color:var(--gold)} .podium .p2{min-height:118px} .podium .p3{min-height:96px}
.tip{background:linear-gradient(135deg,rgba(255,200,87,.16),rgba(255,200,87,.04));border:1px solid rgba(255,200,87,.35);border-radius:var(--r);padding:16px}
.tip h3{font-size:17px;margin-bottom:6px;color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:var(--bg2);color:var(--text);border:1px solid var(--line);padding:12px}
.seg button.on.ph{background:var(--phish);color:var(--phish-ink);border-color:var(--phish)}

@keyframes bob{50%{transform:translateY(-6px)}}
.fade{animation:fade .35s ease both} @keyframes fade{from{opacity:0;transform:translateY(8px)}}
.foot{margin-top:26px;text-align:center;font-size:12px;color:var(--dim)}
</style>

class LocalHost {
  constructor(code, onMsg, onLeave, onReady) { this.bc = new BroadcastChannel(ID_PREFIX + code); this.bc.onmessage = (e) => { if (e.data && e.data.to === 'host') onMsg(e.data.m); }; setTimeout(onReady, 0); }
  broadcast(m) { this.bc.postMessage({ to: 'all', m }); }
  close() { this.bc.close(); }
}
class LocalClient {
  constructor(code, onMsg, onOpen) { this.bc = new BroadcastChannel(ID_PREFIX + code); this.bc.onmessage = (e) => { if (e.data && e.data.to === 'all') onMsg(e.data.m); }; setTimeout(onOpen, 30); }
  send(m) { this.bc.postMessage({ to: 'host', m }); }
  close() { this.bc.close(); }

class PeerHost {
  constructor(code, onMsg, onLeave, onReady, onFail) {
    this.conns = new Map(); this.pidOf = new Map();
    const peer = this.peer = new Peer(ID_PREFIX + code, { debug: 0 });
    peer.on('open', () => onReady());
    peer.on('connection', (conn) => {
      conn.on('open', () => this.conns.set(conn.peer, conn));
      conn.on('data', (m) => { if (m && m.pid) this.pidOf.set(conn.peer, m.pid); onMsg(m); });

// ================= HOST ENGINE (authoritative) =================
const H = {
  S: null, timer: null,
  create(code) {
    this.S = { code, phase: 'lobby', players: [], round: 0, total: ROUNDS, order: shuffle(DECK.map((_, i) => i)), ptr: 0,
      cur: null, votes: {}, deadline: 0, dur: 0, writer: null, reveal: null, eligible: [] };
  },
  player(id) { return this.S.players.find((p) => p.pid === id); },
  online() { return this.S.players.filter((p) => p.on); },
  addPlayer(id, name) {
    const S = this.S; let p = this.player(id);
    if (p) { p.on = true; if (name) p.name = this.uniqueName(name, id); return true; }
    if (S.players.length >= MAX_PLAYERS) { net && net.broadcast({ t: 'reject', pid: id, reason: 'This room is full (8 players).' }); return false; }
    S.players.push({ pid: id, name: this.uniqueName(name || 'Player', id), score: 0, on: true, gain: 0,
      miss: { sender: 0, link: 0, urgency: 0, request: 0, paranoid: 0 } });
    return true;
  },
  uniqueName(n, id) {
    n = cleanName(n) || 'Player'; let out = n, k = 2;
    while (this.S.players.some((p) => p.pid !== id && p.name.toLowerCase() === out.toLowerCase())) out = clip(n, 13) + ' ' + k++;
    return out;
  },
  handle(m) {
    const S = this.S; if (!S || !m || typeof m !== 'object') return;
    const from = String(m.pid || '');
    const isHost = from === S.players[0]?.pid;
    switch (m.t) {
      case 'join': this.addPlayer(from, m.name); break;
      case 'start': if (isHost && S.phase === 'lobby' && this.online().length >= 2) this.startRound(); break;
      case 'next': if (isHost && S.phase === 'reveal') { if (S.round >= S.total) S.phase = 'final'; else this.startRound(); } break;
      case 'again': if (isHost && S.phase === 'final') this.reset(); break;
      case 'vote': this.vote(from, m); break;
      case 'write': this.write(from, m); break;
      case 'bye': this.leave(from); break;
      default: return;
    }
    this.broadcast();
  },
  reset() {
    const S = this.S;
    S.players = S.players.filter((p) => p.on);
    S.players.forEach((p) => { p.score = 0; p.gain = 0; p.miss = { sender: 0, link: 0, urgency: 0, request: 0, paranoid: 0 }; });
    Object.assign(S, { phase: 'lobby', round: 0, order: shuffle(DECK.map((_, i) => i)), ptr: 0, cur: null, votes: {}, writer: null, reveal: null });
  },
  nextDeck() { const S = this.S; if (S.ptr >= S.order.length) { S.order = shuffle(S.order); S.ptr = 0; } return DECK[S.order[S.ptr++]]; },
  startRound() {
    const S = this.S; clearTimeout(this.timer);
    S.round++; S.votes = {}; S.reveal = null; S.cur = null; S.writer = null;
    S.players.forEach((p) => (p.gain = 0));
    const on = this.online();
    if (SCAM_ROUNDS.includes(S.round) && on.length >= 2) {
      S.writer = on[Math.floor(Math.random() * on.length)].pid;
      S.phase = 'writing'; S.dur = WRITE_MS; S.deadline = Date.now() + WRITE_MS;
      this.timer = setTimeout(() => { if (S.phase === 'writing') { S.writer = null; this.beginVoting(this.deckCur()); this.broadcast(); } }, WRITE_MS + 300);
    } else {
      this.beginVoting(this.deckCur());
    }
  },
  deckCur() { const d = this.nextDeck(); return { kind: 'deck', msg: { type: d.type, from: d.from, addr: d.addr || '', subject: d.subject || '', body: d.body, link: d.link }, answer: d.answer, flags: d.flags, why: d.why, author: null }; },
  beginVoting(cur) {
    const S = this.S; clearTimeout(this.timer);
    S.cur = cur; S.phase = 'voting'; S.dur = VOTE_MS; S.deadline = Date.now() + VOTE_MS; S.votes = {};
    S.eligible = this.online().map((p) => p.pid).filter((id) => id !== cur.author);

  },
  write(from, m) {
    const S = this.S; if (S.phase !== 'writing' || from !== S.writer) return;
    const type = m.type === 'sms' ? 'sms' : 'email';
    const body = clip(m.body, 280).trim(); if (!body) return;
    const linkText = clip(m.linkText, 40).trim(), linkUrl = clip(m.linkUrl, 60).trim();
    const name = this.player(from)?.name || 'A player';
    this.beginVoting({ kind: 'player', author: from, answer: m.answer === 'legit' ? 'legit' : 'phish', flags: [],
      why: m.answer === 'legit' ? `${name} wrote a real-looking legit message to make you doubt yourself.` : `${name} wrote this scam. Did it get you?`,
      msg: { type, from: clip(m.from, 30).trim() || 'Unknown', addr: clip(m.addr, 40).trim(), subject: type === 'email' ? clip(m.subject, 60).trim() : '', body,
        link: linkText || linkUrl ? { text: linkText || linkUrl, url: linkUrl || linkText } : null } });
  },
  vote(from, m) {
    const S = this.S; if (S.phase !== 'voting' || !S.eligible.includes(from) || S.votes[from]) return;
    if (m.round !== S.round) return;
    const choice = m.choice === 'legit' ? 'legit' : m.choice === 'phish' ? 'phish' : null; if (!choice) return;
    const flag = FLAGS[m.flag] ? m.flag : null;
    S.votes[from] = { choice, flag, at: Date.now() };
    if (S.eligible.every((id) => S.votes[id] || !this.player(id)?.on)) this.endVoting();
  },
  leave(id) {
    const p = this.player(id); if (!p) return; p.on = false;
    const S = this.S;
    if (S.phase === 'lobby') S.players = S.players.filter((x) => x.pid !== id || x === S.players[0]);
    if (S.phase === 'writing' && S.writer === id) { S.writer = null; this.beginVoting(this.deckCur()); }
    if (S.phase === 'voting' && S.eligible.length && S.eligible.every((x) => S.votes[x] || !this.player(x)?.on)) this.endVoting();
  },
  endVoting() {
    const S = this.S, cur = S.cur; clearTimeout(this.timer);
    const results = {};
    let fooled = 0;
    for (const id of S.eligible) {
      const p = this.player(id); if (!p) continue;
      const v = S.votes[id]; let gain = 0, correct = false, flagOk = false;
      if (v) {
        correct = v.choice === cur.answer;
        if (correct) gain += 100 + Math.round(50 * Math.max(0, Math.min(1, (S.deadline - v.at) / S.dur)));
        if (cur.kind === 'deck' && cur.answer === 'phish' && v.flag && cur.flags.includes(v.flag)) { flagOk = true; gain += 50; }
        if (!correct) fooled++;
      }
      if (cur.kind === 'deck') {
        if (cur.answer === 'phish' && !correct) cur.flags.forEach((f) => p.miss[f]++);
        if (cur.answer === 'legit' && v && !correct) p.miss.paranoid++;
      }
      p.score += gain; p.gain = gain;
      results[id] = { choice: v ? v.choice : null, correct, flagOk, gain };
    }
    if (cur.kind === 'player' && cur.author) {
      const a = this.player(cur.author);
      if (a) { const g = 100 * fooled; a.score += g; a.gain = g; results[cur.author] = { author: true, fooled, gain: g }; }
    }
    S.reveal = { answer: cur.answer, flags: cur.flags, why: cur.why, kind: cur.kind, authorName: cur.author ? this.player(cur.author)?.name : null, results };
    S.phase = 'reveal';
  },
  pub() {
    const S = this.S; const salt = ':' + S.round + ':' + S.code;
    return {
      code: S.code, phase: S.phase, round: S.round, total: S.total, hostPid: S.players[0]?.pid,
      players: S.players.map((p) => ({ pid: p.pid, name: p.name, score: p.score, on: p.on, gain: p.gain, miss: p.miss })),
      remaining: Math.max(0, S.deadline - Date.now()), dur: S.dur,
      writerTag: S.phase === 'writing' && S.writer ? hash(S.writer + salt) : null,
      authorTag: S.cur && S.cur.author ? hash(S.cur.author + salt) : null,
      kind: S.cur ? S.cur.kind : null,

      votedTags: Object.keys(S.votes).map((id) => hash(id + salt)),
      reveal: S.phase === 'reveal' ? S.reveal : null,
    };
  },
  broadcast() {
    if (!this.S) return;
    const P = this.pub();
    onState(P);
    net && net.broadcast({ t: 'state', s: P });
  },
};

let net = null, P = null, localDeadline = 0, screenKey = '', joinTimer = null;
const ui = { view: 'home', err: '', flag: null, myVote: null, writeAnswer: 'phish', writeType: 'email' };

function send(m) {
  m.pid = me.pid;
  if (me.isHost) H.handle(m);
  else if (net) net.send(m);
}

function onState(s) {
  const prevRound = P ? P.round : -1, prevPhase = P ? P.phase : '';
  P = s; ui.view = 'game'; clearTimeout(joinTimer);
  if (P.round !== prevRound || (P.phase === 'lobby' && prevPhase !== 'lobby')) { ui.myVote = null; ui.flag = null; }
  localDeadline = Date.now() + (P.remaining || 0);
  if (!P.players.some((p) => p.pid === me.pid) && !me.isHost) { /* not yet admitted */ }
  render();
}

function onNetMsg(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'state' && m.s) onState(m.s);
  if (m.t === 'reject' && m.pid === me.pid) { leaveGame(m.reason || 'Could not join.'); }
}

async function createRoom() {
  const name = cleanName($('#name').value); if (!name) return showErr('Enter your name first.');
  me.name = name; store.set('pol-name', name); me.isHost = true;
  ui.view = 'connecting'; ui.connectMsg = 'Opening a room…'; render();
  if (!LOCAL && !(await window.__peerReady)) return leaveGame("Couldn't load the connection library. Check your internet and try again.");
  const attempt = (tries) => {
    const code = newCode(); me.code = code;
    const ready = () => { H.create(code); H.addPlayer(me.pid, me.name); H.broadcast(); };
    const fail = (e) => {
      if (e && e.type === 'unavailable-id' && tries < 4) { net && net.close(); return attempt(tries + 1); }
      if (H.S) return; // already running; ignore transient errors
      leaveGame('Could not open a room (' + (e && e.type || 'network') + '). Try again.');
    };
    net = LOCAL ? new LocalHost(code, (m) => H.handle(m), (id) => { H.leave(id); H.broadcast(); }, ready)
                : new PeerHost(code, (m) => H.handle(m), (id) => { H.leave(id); H.broadcast(); }, ready, fail);
  };
  attempt(0);
}

async function joinRoom(codeArg) {
  const name = cleanName($('#name').value); if (!name) return showErr('Enter your name first.');
  const code = String(codeArg || $('#code').value || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) return showErr('Room codes have 4 letters.');
  me.name = name; me.code = code; me.isHost = false; store.set('pol-name', name);
  ui.view = 'connecting'; ui.connectMsg = 'Joining room ' + code + '…'; render();
  if (!LOCAL && !(await window.__peerReady)) return leaveGame("Couldn't load the connection library. Check your internet and try again.");
  const open = () => { send({ t: 'join', name }); joinTimer = setTimeout(() => { if (!P) leaveGame('No answer from room ' + code + '. Check the code.'); }, 6000); };
  const closed = () => { if (ui.view === 'game') { ui.view = 'lost'; render(); } };
  const fail = (e) => {
    if (P && ui.view === 'game') return;
    leaveGame(e && e.type === 'peer-unavailable' ? 'Room ' + code + " doesn't exist (or the host closed it)." : 'Connection failed. Try again.');
  };
  net = LOCAL ? new LocalClient(code, onNetMsg, open) : new PeerClient(code, onNetMsg, open, closed, fail);
}

function leaveGame(err) {
  try { if (!me.isHost) send({ t: 'bye' }); } catch (_) {}
  try { net && net.close(); } catch (_) {}
  net = null; P = null; me.isHost = false; H.S = null; clearTimeout(H.timer);
  ui.view = 'home'; ui.err = err || ''; screenKey = ''; render();
}

function render() {
  const app = $('#app');
  let key, html;
  if (ui.view !== 'game' || !P) {
    key = ui.view + '|' + ui.err;
    if (key === screenKey) return;
    html = ui.view === 'connecting' ? viewConnecting() : ui.view === 'lost' ? viewLost() : viewHome();
  } else {
    const iAmWriter = P.writerTag && P.writerTag === tag();
    key = ['g', P.phase, P.round, iAmWriter ? 'w' : '', ui.myVote ? 'v' : '', P.phase === 'lobby' || P.phase === 'reveal' || P.phase === 'final' ? JSON.stringify(P.players) : ''].join('|');
    if (key === screenKey) { patch(); return; }
    html = { lobby: viewLobby, writing: viewWriting, voting: viewVoting, reveal: viewReveal, final: viewFinal }[P.phase]();
  }

  bind();

      <div class="row"><div class="grow"><label for="w-lt">Button / link text</label><input id="w-lt" maxlength="40" placeholder="optional"></div><div class="grow"><label for="w-lu">Where it really goes</label><input id="w-lu" maxlength="60" placeholder="optional"></div></div>
      <div id="werr" class="err" hidden></div>
      <button class="btn gold" id="wsend">Send it to everyone</button></div></div>`;
}

function viewVoting() {
  const iAmAuthor = P.authorTag && P.authorTag === tag();
  const deckRound = P.kind === 'deck';
  let bottom;
  if (iAmAuthor) bottom = `<div class="locked"><b>😈 Your message is live</b>Watch them squirm. <span id="vcount"></span></div>`;
  else if (ui.myVote) bottom = `<div class="locked"><b style="color:${ui.myVote.choice === 'phish' ? 'var(--phish)' : 'var(--legit)'}">${ui.myVote.choice === 'phish' ? 'PHISH' : 'LEGIT'}</b>Locked in${ui.myVote.flag ? ' · flag: ' + esc(FLAGS[ui.myVote.flag].label) : ''}. <span id="vcount"></span></div>`;
  else bottom = `${deckRound ? `<div><label>Spotted a red flag? Tap it first <span style="color:var(--gold)">(+50 if right)</span></label><div class="flags">${Object.entries(FLAGS).map(([k, f]) => `<button class="flag ${ui.flag === k ? 'on' : ''}" data-flag="${k}">${esc(f.label)}</button>`).join('')}</div></div>` : ''}
    <div class="vote"><button class="ph" data-vote="phish">PHISH<small>it's a scam</small></button><button class="lg" data-vote="legit">LEGIT<small>it's real</small></button></div>
    <div class="center muted small" id="vcount"></div>`;
  return `${topbar()}<div class="fade stack">${roundHead(`Round ${P.round} of ${P.total}${P.kind === 'player' ? ' · 🕵️' : ''}`)}${card(P.msg)}${bottom}</div>`;
}

function viewReveal() {
  const R = P.reveal, mine = R.results[me.pid];
  const host = isHostView();
  const ranked = P.players.slice().sort((a, b) => b.score - a.score);
  let mineHtml = '';
  if (mine && mine.author) mineHtml = `<div class="mine"><div><b>You fooled ${mine.fooled} ${mine.fooled === 1 ? 'player' : 'players'}</b><div class="muted small">Scammer bonus</div></div><div class="g ${mine.gain ? 'pos' : 'zero'}">+${mine.gain}</div></div>`;
  else if (mine) mineHtml = `<div class="mine"><div><b>${mine.choice ? (mine.correct ? 'Correct ✓' : 'Fooled ✗') : 'Too slow ⏱'}</b><div class="muted small">${mine.flagOk ? 'and you spotted a real red flag (+50)' : mine.correct ? 'speed bonus included' : mine.choice ? 'you said ' + mine.choice.toUpperCase() : 'no vote in time'}</div></div><div class="g ${mine.gain ? 'pos' : 'zero'}">+${mine.gain}</div></div>`;
  const flagList = R.flags.length ? `<div class="flags">${R.flags.map((f) => `<span class="flag on">🚩 ${esc(FLAGS[f].label)}</span>`).join('')}</div>` : '';
  return `${topbar()}<div class="fade stack">
    <div class="verdict ${R.answer}">${R.answer === 'phish' ? 'PHISH 🎣' : 'LEGIT ✅'}<small>${R.kind === 'player' ? 'Written by ' + esc(R.authorName || 'a player') : `Round ${P.round} of ${P.total}`}</small></div>
    ${mineHtml}
    ${card(P.msg, R.flags)}
    ${flagList}
    <p class="why">${esc(R.why)}</p>
    <div class="panel"><h3 style="font-size:17px;margin-bottom:4px">Scores</h3><ul class="board">${ranked.map((p, i) => `<li class="${p.pid === me.pid ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="nm">${esc(p.name)}</span><span class="gn">${p.gain ? '+' + p.gain : ''}</span><span class="sc">${p.score}</span></li>`).join('')}</ul></div>
    ${host ? `<button class="btn gold" id="next">${P.round >= P.total ? 'See final results' : 'Next round →'}</button>` : `<div class="locked">Waiting for the host to continue…</div>`}</div>`;
}

function viewFinal() {
  const ranked = P.players.slice().sort((a, b) => b.score - a.score);
  const [a, b, c] = ranked; const host = isHostView();
  const mp = meP();
  let tipTitle = 'Sharp eyes 👀', tipText = "You didn't miss a single red flag. Scammers would hate you.";
  if (mp) {
    const entries = Object.entries(mp.miss || {}).sort((x, y) => y[1] - x[1]);
    if (entries.length && entries[0][1] > 0) {
      const k = entries[0][0];
      tipTitle = k === 'paranoid' ? 'Your weak spot: false alarms' : 'Your weak spot: ' + FLAGS[k].label.toLowerCase();
      tipText = k === 'paranoid' ? PARANOID_TIP : FLAGS[k].tip;
    }
  }
  const pod = (p, cls, medal) => (p ? `<div class="${cls}"><div class="m">${medal}</div><div class="n">${esc(p.name)}</div><div class="s">${p.score}</div></div>` : '<div style="visibility:hidden"></div>');
  return `${topbar()}<div class="fade stack">
    <h2 class="center" style="font-size:30px;margin-top:6px">Final scores</h2>
    <div class="podium">${pod(b, 'p2', '🥈')}${pod(a, 'p1', '🥇')}${pod(c, 'p3', '🥉')}</div>
    <div class="panel"><ul class="board">${ranked.map((p, i) => `<li class="${p.pid === me.pid ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span></li>`).join('')}</ul></div>
    <div class="tip"><h3>${esc(tipTitle)}</h3><p>${esc(tipText)}</p></div>
    ${host ? '<button class="btn gold" id="again">Play again</button>' : '<div class="locked">The host can start a new game.</div>'}
    <button class="btn ghost" id="home">Leave</button></div>`;
}

// live bits that change without re-rendering the whole screen
function patch() {
  if (!P || ui.view !== 'game') return;
  const vc = $('#vcount'); if (vc) vc.textContent = `${P.voted}/${P.eligible} voted`;
  tick();
}
function tick() {
  if (!P || (P.phase !== 'voting' && P.phase !== 'writing')) return;
  const left = Math.max(0, localDeadline - Date.now());
  const t = $('#tleft'), bar = $('#tbar');
  if (t) t.textContent = Math.ceil(left / 1000) + 's';
  if (bar) { bar.firstElementChild.style.width = (P.dur ? (100 * left) / P.dur : 0) + '%'; bar.classList.toggle('low', left < 6000); }
}
setInterval(tick, 200);

function bind() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('#create', createRoom);
  on('#join', () => joinRoom());
  on('#joinPre', () => joinRoom(params.get('room')));
  on('#cancel', () => leaveGame());
  on('#home', () => leaveGame());
  on('#rejoin', () => { const code = me.code; try { net && net.close(); } catch (_) {} net = null; P = null; ui.view = 'home'; render(); $('#name').value = me.name; joinRoom(code); });
  const codeIn = $('#code'); if (codeIn) codeIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(); });
  on('#start', () => send({ t: 'start' }));
  on('#next', () => send({ t: 'next' }));
  on('#again', () => send({ t: 'again' }));
  on('#copy', async () => { const u = shareUrl(); try { await navigator.clipboard.writeText(u); $('#copy').textContent = 'Link copied ✓'; } catch (_) { prompt('Copy this link:', u); } });
  const qr = $('#qr'); if (qr && window.QRCode) { try { new QRCode(qr, { text: shareUrl(), width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M }); } catch (_) {} }
  document.querySelectorAll('[data-flag]').forEach((b) => (b.onclick = () => { ui.flag = ui.flag === b.dataset.flag ? null : b.dataset.flag; document.querySelectorAll('[data-flag]').forEach((x) => x.classList.toggle('on', x.dataset.flag === ui.flag)); }));
  document.querySelectorAll('[data-vote]').forEach((b) => (b.onclick = () => {
    if (ui.myVote) return;
    ui.myVote = { choice: b.dataset.vote, flag: P.kind === 'deck' ? ui.flag : null };
    send({ t: 'vote', round: P.round, choice: ui.myVote.choice, flag: ui.myVote.flag });
    render();
  }));
  document.querySelectorAll('[data-ans]').forEach((b) => (b.onclick = () => { ui.writeAnswer = b.dataset.ans; document.querySelectorAll('[data-ans]').forEach((x) => { x.className = x.dataset.ans === ui.writeAnswer ? 'on ' + (x.dataset.ans === 'phish' ? 'ph' : 'lg') : ''; }); }));
  document.querySelectorAll('[data-type]').forEach((b) => (b.onclick = () => { const keep = readWriter(); ui.writeType = b.dataset.type; screenKey = ''; render(); fillWriter(keep); }));
  on('#wsend', () => {
    const w = readWriter();
    if (!w.body.trim()) { const e = $('#werr'); e.textContent = 'Write a message first.'; e.hidden = false; return; }
    const btn = $('#wsend'); btn.disabled = true; btn.textContent = 'Sent ✓';
    send(Object.assign({ t: 'write', type: ui.writeType, answer: ui.writeAnswer }, w));
  });
}
function readWriter() { const v = (id) => ($(id) ? $(id).value : ''); return { from: v('#w-from'), addr: v('#w-addr'), subject: v('#w-subj'), body: v('#w-body'), linkText: v('#w-lt'), linkUrl: v('#w-lu') }; }
function fillWriter(w) { const s = (id, val) => { if ($(id)) $(id).value = val || ''; }; s('#w-from', w.from); s('#w-addr', w.addr); s('#w-subj', w.subject); s('#w-body', w.body); s('#w-lt', w.linkText); s('#w-lu', w.linkUrl); }

window.addEventListener('pagehide', () => { if (net && !me.isHost) send({ t: 'bye' }); });
window.addEventListener('beforeunload', (e) => { if (me.isHost && P && P.phase !== 'lobby' && P.phase !== 'final') { e.preventDefault(); e.returnValue = ''; } });
render();
</script>
</body>
</html>
